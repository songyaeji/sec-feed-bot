# judge scale(파장 자기평가 1~5) 하한 — 이 값 미만은 LLM이 긴급이라 해도
# 코드에서 탈락시킨다(이중 게이트). 5 = 국가적/글로벌 파장만. 긴급 알림이
# 너무 조용하면 4로 낮춰 업계 전체 파장까지 허용
urgent_min_scale: 5

# v8 즉시 발송 1차 게이트 — 이 키워드가 제목/요약에 있어야 LLM 판정
# 후보가 된다 (사건·사고 어휘만; 최종 선별은 judge.py의 sonnet이 한다)
urgent_gate:
  - 유출
  - 해킹
  - 침해
  - 탈취
  - 마비
  - 피해
  - breach
  - leak
  - hacked
  - compromised
  - stolen
  - exfiltrat
  - mass exploitation
  - under active exploitation

# 전역 신선도 게이트: 카드뉴스 = 동향 추적이므로 오래된 기사(재게시·후속
# 보도가 끌어올린 역주행 원문)를 전 소스에서 거른다. 소스별 max_age_days가
# 있으면 그 값이 우선하고, max_age_days: false(또는 0)이면 필터를 끈다
# (릴리스/논문 atom 등 오래돼도 유효한 피드용). rss/fsec/fss에 적용.
default_max_age_days: 14

# 특정 기자/작성자 후순위 — 신뢰도 이슈로 카드 우선순위를 낮춘다.
# 피드 author 바이라인이 author_contains를 포함하면 사서가 매긴 importance에서
# penalty만큼 감점한다(최소 1). 완전 제외가 아니라 강등이라 importance가 충분히
# 높은 대형 사건이면 카드에 살아남을 수 있다. source 지정 시 해당 소스에만 적용.
deprioritize_authors:
  - source: "보안뉴스"
    author_contains: "지진솔"   # 2026-07-09 클로드코드 유출 오보 계기(사용자 결정)
    penalty: 2

# cap on individual cards (urgent items) per run; the digest embed is not
# capped here since it already truncates itself per category. Overflow is
# still recorded in seen.json so it is not re-sent next run
# (env MAX_ITEMS_PER_RUN overrides this)
max_items_per_run: 25

# 아침 다이제스트 뉴스 카드 상한 — 가변 장수(사용자 결정 2026-11-20).
# 사서 판정(사고·법제도·기관 발표, importance >= min_card_importance)을 받고
# 발행 원장·중복 게이트·문안 재작성 검증을 통과한 항목만 싣는다. 못 채우면
# 그날은 적게 낸다 — 원문 그대로 채우던 백필은 폐지됐다. 뉴스 0건이면
# 발행하지 않는다(시간창 안 다음 트리거가 재시도).
max_news_items: 7

# 뉴스 카드에 오르는 기사 성격(사서 kind) — 사고·법제도·기관 발표.
# vuln(단순 취약점 권고)은 '오늘의 CVE' 코너, other(홍보·실적·칼럼)는 제외
card_news_kinds: [incident, policy, institution]
min_card_importance: 3

# 취약점 권고 전용 소스 — 사서 판정과 무관하게 뉴스 카드에 오르지 않고
# '오늘의 CVE' 코너로만 간다(사용자 결정 2026-11-20: 11-20 Siemens·Elecbrakes
# ICS 권고가 뉴스 카드를 차지한 사례)
vuln_advisory_sources:
  - "CISA Advisories"
  - "KISA 보안공지 (보호나라)"

# 사서 입력 컷(librarian_news_cap)과 카드 동점 정렬용 순위 점수
# = 휴리스틱(AI +120, KEV +100, 금융 +70, critical +40 등) + 소스 가중치
# + 성격 가산(digest_select._rank_score).
# 2026-11-20 재조정(QA D1): 기관 이름의 구글뉴스 쿼리가 기관 가중치를 받아
# 상위 60 중 48을 차지했다. 기관 가중치는 기관 원문 소스에만 준다. 구글뉴스
# 대리 소스(링크가 news.google.com)는 이름과 무관하게 source_weights를 받지
# 않고 news_proxy_weight만 받는다. 국내 사고 매체(category news)는 해외 사고
# 매체(category high +20)와 같은 선에 맞춘다
source_weights:
  "KISA 보도자료": 50
  "개인정보보호위원회 보도자료": 50
  "과기정통부 보도자료": 50
  "KISA 보고서/가이드": 40
  "금융보안원": 30          # fsec 게시판 원문. 같은 이름의 구글뉴스 쿼리는 제외
  "금융감독원": 30
  "보안뉴스": 20
  "데일리시큐": 20
  "The Record": 20
  "CISA Advisories": -80
  "KISA 보안공지 (보호나라)": -80

# 구글뉴스 대리 소스(금융보안원, 개인정보보호위원회, 금융위원회,
# 국가사이버안보센터 쿼리 등)의 소스 가중치. 기사 내용 점수로만 겨룬다
news_proxy_weight: 0

# 성격 가산 — 사서 판정 kind, 없으면 digest_select.classify_kind_fallback
# 규칙 분류. 카드 성격(사고, 법제도, 기관 발표)을 올리고 단순 취약점과
# 홍보 기사를 내린다. 휴리스틱 태그 가산(제로데이 +80, 금융 +70)보다 크게
# 잡아 성격이 먼저 갈리게 한다
kind_rank_bonus:
  incident: 80
  policy: 80
  institution: 70
  vuln: -60
  other: -80

# 기관 원문 소스 — 규칙 분류에서 제목에 성격 신호가 없으면 기관 발표로 본다
# (보도자료 제목에는 기관 이름이 빠지기 쉽다). 구글뉴스 대리 소스는 해당 없음.
# 보안 전용이거나 키워드로 거른 소스만 넣는다. 금융감독원 보도자료는 금융
# 일반 자료(예: 외국인 증권투자 동향)가 섞여 넣지 않는다
institution_sources:
  - "KISA 보도자료"
  - "개인정보보호위원회 보도자료"
  - "과기정통부 보도자료"
  - "KISA 보고서/가이드"
  - "금융보안원"
  - "NCSC-UK"

# 트렌드 픽 — 하루 최대 2건(사용자 결정 2026-11-20). 그룹별 상위 이 건수만
# 후보 풀에 넣고, 발송 직전 trend_enrich.pick이 풀 전체에서 최대 2건을 골라
# 한국어 제목·설명을 쓴다. 볼 만한 게 1건이면 1건, 없으면 보내지 않는다
trend_pool_per_group: 8

# 후보 풀 나열 순서(그룹 키 = trend_group 또는 소스명) — 사용자 관심축
# (툴·skills·릴리스) 우선, 범용 커뮤니티는 뒤. 선정 가중치는 아니다
trend_priority:
  - "GitHub 급상승"
  - "vendor"
  - "HN 트렌드"
  - "Mastodon 화제 링크"
  - "Lobsters"
  - "youtube"
max_cve_items: 10

# 사서(LLM 위키 사서)에 넘길 뉴스 후보 상한 — 전 항목 판정은 전역 예산
# (librarian.DEADLINE_SECONDS)을 구조적으로 초과해 뉴스 무판정 유실을
# 재발시킨다(2026-07-12: 171건 입력 → 119건 유실 → 뉴스 카드 0장 발행).
# 휴리스틱 상위 이 건수만 판정받고, 초과분은 pending 이월(TTL이 청소).
# CVE는 별도로 max_cve_items건만 결정적으로 선발돼 사서 입력에 합류한다.
# 논문(paper)은 카드 부적합이라 사서·카드 모두 제외.
librarian_news_cap: 60

# 사서 입력 컷 안의 소스 다양성(2026-11-20, QA D1). digest_select.librarian_cut
# - librarian_group_same_event: 같은 사건 보도(CVE 교집합, 제목 유사도)는
#   대표 1건만 사서에 넣고 나머지는 이월
# - librarian_source_cap: 소스당 최대 건수. 구글뉴스 대리 소스와 같은 이름의
#   원문 크롤러는 따로 센다. 못 채운 자리는 순위순으로 더 채운다
# - librarian_source_decay: 고른 목록의 순서만 바꾼다. 같은 소스 k번째
#   항목은 k*이 값만큼 낮춰 줄 세워 한 소스가 앞자리를 독식하지 않게 한다
librarian_group_same_event: true
librarian_source_cap: 8
librarian_source_decay: 40

# digest에서 이월(pending) 항목의 수명(일) — seen 최초 목격 기준.
# 카드뉴스는 일간 동향이라 이보다 오래 이월된 무판정 꼬리는 소진한다
# (pending 무한 누적 → 사서 예산 재초과 방지)
pending_ttl_days: 3

# 발행 회차 기준일(NO.1 발행일) — 회차는 날짜의 순수 함수: (KST 오늘 - 기준일)+1.
# 같은 날 재발행해도 NO.가 변하지 않는다(사용자 결정, v26).
# 검산: 07-12=NO.5, 07-13=NO.6
issue_epoch: "2026-07-08"

# 위키 INDEX.md 토픽 줄 수명(일, 최종갱신일 기준) — 초과분은 digest가
# wiki/INDEX-archive.md로 이동한다. 사서가 배치마다 INDEX 전체를 읽으므로
# 무한 성장은 배치 타임아웃 → 뉴스 유실로 되돌아온다(2026-07-12 실측).
# 토픽 페이지 자체는 보존되고 사서는 Grep으로 여전히 검색 가능.
wiki_index_max_age_days: 60

# 인스타그램/쓰레드 크로스포스트 — 토큰·계정 ID는 GitHub secrets(env)로만
# 공급한다(IG_USER_ID/IG_ACCESS_TOKEN/THREADS_USER_ID/THREADS_ACCESS_TOKEN).
# 어느 플랫폼이 실패해도 디스코드 발송·상태 저장에는 영향 없음(fail-open).
crosspost:
  # 카드 JPEG 사본이 게시되는 포트폴리오 base URL — crosspost.py가
  # {site_base}/{date}/card_NN.jpg 형태로 IG/Threads에 발행한다
  site_base: "https://songyaeji.github.io/trend"
  instagram:
    enabled: true
  threads:
    # 사용자 결정(2026-07-13): 쓰레드 제외 — 인스타그램만 발행.
    # 재개하려면 true + collect.yml Crosspost 스텝에 THREADS_* env 복원
    enabled: false
  # 사서 키워드 해시태그 뒤에 붙는 고정 태그
  hashtags: [보안뉴스, 사이버보안, 카드뉴스]

discord:
  # embed color mapping (hex ints)
  colors:
    critical: 0xE74C3C
    high: 0xF1C40F
    research: 0x3498DB
    ai: 0x9B59B6
    news: 0x95A5A6
    paper: 0x2ECC71

nvd_filter:
  min_cvss: 8.0
  keywords:
    - "llm"
    - "machine learning"
    - "pytorch"
    - "langchain"
    - "openssl"
    - "windows"
    - "linux kernel"
    - "artificial intelligence"
    - "neural network"
    - "tensorflow"
    - "hugging face"
    - "openai"

# 매처는 text_rules.keyword_matcher. 전부 대문자로 쓴 약어는 대소문자를 구분한다
# (소문자 apt는 패키지 관리자, swift는 형용사). 하이픈과 공백, 복수형은 같은 말로 본다
tags:
  금융: [금융, 은행, 뱅킹, 핀테크, 증권, 보험, 카드사, 결제, 페이, banking, fintech, financial, SWIFT, ATM]
  AI: [LLM, prompt injection, 생성형, 인공지능, machine learning, neural, deepfake, 딥페이크]
  RCE: [remote code execution, RCE, 원격 코드]
  제로데이: [zero-day, 0-day, 제로데이, in the wild]
  랜섬웨어: [ransomware, 랜섬웨어]
  APT: [APT, 국가배후, state-sponsored, lazarus, kimsuky]
  피싱: [phishing, 피싱, smishing, 스미싱]
