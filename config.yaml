    keywords: ["ai", "llm*", "gpt*", "chatgpt", "claude", "anthropic",
               "openai", "gemini", "mcp", "agent*", "model*", "prompt*",
               "security", "cyber*", "hack*", "breach*", "vulnerabilit*",
