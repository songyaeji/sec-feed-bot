  # 중인 외부 링크를 공유 횟수와 함께 준다 — 커뮤니티 화제성이 이미
  # 필터라는 트렌드 레인의 전제가 레딧과 동일하다. 무인증 REST라
  # Actions 데이터센터 IP에서도 200이었다(2026-08-18 실측).
  # min_shares: 한두 명만 공유한 링크는 '화제'가 아니다 — 잡음 차단
  - name: "Mastodon 화제 링크"
