  # 핫한 AI 툴·skills·MCP·영상·글 후보를 모아 '트렌드 픽' embed 1건으로
  # 발송한다(notify.send_trend). 발송 시점만 아침 카드뉴스 발행 직후로
  # 묶여 하루 1회다(2026-08-13, trend_lane._should_send_trend).
  # 빈도 제어: 하루 1회 게이트 + LLM이 후보 풀에서 최대 2건 선정
  # (2026-11-20, trend_enrich.pick). 커뮤니티 화제성은 선정 참고 지표다.

  # 멀티레딧 top?t=day 한 요청(개별 요청은 429 — 기존 소스 교훈).
